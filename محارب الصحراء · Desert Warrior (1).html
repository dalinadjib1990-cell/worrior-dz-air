<style>
:root{--g:#7dff9a;--r:#ff4d4d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;font-family:ui-monospace,Menlo,'Segoe UI',Tahoma,sans-serif;color:var(--g)}
#gl,#cp,#fx,#dmg{position:fixed;inset:0;width:100%;height:100%;display:block}

.h{position:fixed;text-shadow:0 0 3px #000,0 0 7px var(--g);font-size:clamp(10px,3vh,16px);font-weight:600;font-variant-numeric:tabular-nums;white-space:pre;line-height:1.3}

#wp{right:calc(8vw + env(safe-area-inset-right,0px));bottom:3vh;text-align:right}

#xh{position:fixed;left:50%;top:50%;width:70px;height:70px;margin:-35px 0 0 -35px}
#hm{position:fixed;left:50%;top:50%;margin:-14px 0 0 -14px;width:28px;height:28px;opacity:0}
#rd{position:fixed;left:50%;top:1.5vh;width:28vh;height:28vh;transform:translateX(-50%)}
#fg{position:fixed;left:calc(50% - 26vh);top:2.5vh;width:10vh}
.flg svg{width:100%;display:block;filter:drop-shadow(0 0 3px #000)}

#msg{position:fixed;top:37vh;width:100%;text-align:center;font-size:clamp(14px,4vh,22px);text-shadow:0 0 4px #000,0 0 8px var(--g);opacity:0;transition:opacity .3s;unicode-bidi:plaintext}
#hp,#sb{position:fixed;left:50%;transform:translateX(-50%);width:22vw;height:7px;border:1px solid var(--g)}
#hp{top:30.5vh}#sb{top:33.5vh;display:none;border-color:#ffd54a}
#hp::after,#sb::after{position:absolute;left:calc(100% + 8px);top:-3px;font-size:clamp(9px,2.4vh,13px);white-space:nowrap;text-shadow:0 0 3px #000;unicode-bidi:plaintext}

.rb{border-radius:50%;font-size:clamp(11px,3vh,15px)}
#fire{right:calc(3vw + env(safe-area-inset-right,0px));bottom:26vh;width:19vh;height:19vh;color:#ff7b7b;border-color:#ff5b5b;background:rgba(60,10,10,.5);font-size:clamp(14px,4vh,22px)}

#bo{left:calc(3vw + env(safe-area-inset-left,0px));bottom:32vh;width:14vh;height:14vh}#fl{left:calc(3vw + env(safe-area-inset-left,0px));bottom:48vh;width:12vh;height:12vh;color:#ffd54a;border-color:#ffd54a}
.sm{top:2vh;width:8vh;height:8vh;border-radius:8px;font-size:clamp(12px,4vh,20px)}
#menu,#over,#rot,#mp{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle at 50% 40%,#3a2540,#07080c);gap:2vh;z-index:9}
#menu{background:#000;overflow:hidden}
#menu::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent 40%,rgba(0,0,0,.6)),linear-gradient(0deg,rgba(0,0,0,.75),transparent 50%)}

#mc .flg{width:11vh}
h2{margin:0;font-size:clamp(12px,4vh,22px);letter-spacing:.3em;color:#ffd54a}
#over{display:none;background:rgba(40,0,0,.82)}
#mp{display:none;flex-direction:row;gap:3vw;background:radial-gradient(circle at 40% 50%,#10281a,#050a07);padding:0 3vw}
#mpl{width:52vw;height:92vh}#mps,#mps svg{width:100%;height:100%}
#mpr{display:flex;flex-direction:column;align-items:center;gap:2vh;width:38vw}#mpr .flg{width:11vh}
#rot{display:none;z-index:20;background:#07080c;font-size:20px}
@media(orientation:portrait){#rot{display:flex}}
h1{margin:0;font-size:clamp(26px,9vh,56px);text-shadow:0 0 20px var(--g)}
p{margin:0;font-size:clamp(12px,3.4vh,18px);opacity:.9;line-height:1.7}
.go{position:static;padding:1.6vh 6vw;font-size:clamp(14px,4vh,22px);border-radius:10px}

#shl{display:flex;gap:2vw;width:94vw;justify-content:center;align-items:flex-start}#sha,#shw{width:46vw;display:flex;flex-direction:column;gap:.8vh}

#mu{left:calc(3vw + env(safe-area-inset-left,0px));bottom:3vh;width:7vh;height:7vh;font-size:clamp(11px,3.4vh,18px);z-index:12;padding:0}
